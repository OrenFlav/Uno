<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Uno Comp </title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💌</text></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="wrap">
      <header class="head">
        <div class="head-emoji">💌</div>
        <h1>Uno Compilation</h1>
        <p>Scan a code with your phone, or just tap it.</p>
      </header>

      <!-- The list is built automatically from js/app.js -->
      <ol class="list" id="list"></ol>

      <footer class="foot">magic-magic by orange_flavor</footer>
    </main>

    <!-- Background music -->
    <audio id="bgm" src="audio/Statue.mp3" loop preload="auto"></audio>
    <button
      class="music"
      id="musicBtn"
      type="button"
      aria-label="Play or pause music"
      hidden
    >
      <span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="music-text">Statue · Lil Eddie</span>
    </button>

    <!-- QR code library (bundled locally, no CDN needed) -->
    <script src="js/qrcode.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
